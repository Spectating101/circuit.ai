apiVersion: v1
kind: Namespace
metadata:
  name: circuit-ai

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: circuit-ai-config
  namespace: circuit-ai
data:
  DATABASE_URL: "postgresql://circuitai:password@postgres:5432/circuitai"
  REDIS_URL: "redis://redis:6379/0"
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"

---
apiVersion: v1
kind: Secret
metadata:
  name: circuit-ai-secrets
  namespace: circuit-ai
type: Opaque
stringData:
  SECRET_KEY: "CHANGE_ME"
  JWT_SECRET: "CHANGE_ME"
  STRIPE_SECRET_KEY: "sk_live_CHANGE_ME"
  STRIPE_WEBHOOK_SECRET: "whsec_CHANGE_ME"
  OPENAI_API_KEY: "sk-CHANGE_ME"
  DIGIKEY_CLIENT_ID: "CHANGE_ME"
  DIGIKEY_CLIENT_SECRET: "CHANGE_ME"
  MOUSER_API_KEY: "CHANGE_ME"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: circuit-ai-api
  namespace: circuit-ai
  labels:
    app: circuit-ai-api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: circuit-ai-api
  template:
    metadata:
      labels:
        app: circuit-ai-api
    spec:
      containers:
      - name: api
        image: circuitai/api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: circuit-ai-config
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: circuit-ai-config
              key: REDIS_URL
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: circuit-ai-secrets
              key: SECRET_KEY
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: circuit-ai-secrets
              key: JWT_SECRET
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: circuit-ai-secrets
              key: STRIPE_SECRET_KEY
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        volumeMounts:
        - name: models
          mountPath: /app/models
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: circuit-ai-models-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: circuit-ai-api
  namespace: circuit-ai
  labels:
    app: circuit-ai-api
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: circuit-ai-api

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: circuit-ai-frontend
  namespace: circuit-ai
  labels:
    app: circuit-ai-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: circuit-ai-frontend
  template:
    metadata:
      labels:
        app: circuit-ai-frontend
    spec:
      containers:
      - name: frontend
        image: circuitai/frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "https://api.circuit-ai.com"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: circuit-ai-frontend
  namespace: circuit-ai
  labels:
    app: circuit-ai-frontend
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: circuit-ai-frontend

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: circuit-ai
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: "circuitai"
        - name: POSTGRES_USER
          value: "circuitai"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: circuit-ai-secrets
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: circuit-ai
spec:
  clusterIP: None
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgres

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: circuit-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        command: ["redis-server"]
        args: ["--requirepass", "$(REDIS_PASSWORD)"]
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: circuit-ai-secrets
              key: REDIS_PASSWORD
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: redis-data
          mountPath: /data
      volumes:
      - name: redis-data
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: circuit-ai
spec:
  clusterIP: None
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: redis

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: circuit-ai-ingress
  namespace: circuit-ai
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
  - hosts:
    - circuit-ai.com
    - api.circuit-ai.com
    secretName: circuit-ai-tls
  rules:
  - host: api.circuit-ai.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: circuit-ai-api
            port:
              number: 8000
  - host: circuit-ai.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: circuit-ai-frontend
            port:
              number: 3000

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: circuit-ai-api-hpa
  namespace: circuit-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: circuit-ai-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: circuit-ai-models-pvc
  namespace: circuit-ai
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
